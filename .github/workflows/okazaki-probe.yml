name: Probe Okazaki

on:
  push:
    branches: [probe-okazaki]
    paths:
      - '.github/workflows/okazaki-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4 requests
      - name: Inspect Okazaki source
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          headers={'User-Agent':'Mozilla/5.0 (compatible; EventHunterPersonal/1.0)','Accept-Language':'ja-JP,ja;q=0.9'}
          for url in ['https://okazaki-kanko.jp/event/','https://okazaki-kanko.jp/page:2','https://okazaki-kanko.jp/page:3']:
              r=requests.get(url,timeout=30,headers=headers,allow_redirects=True)
              print('PAGE',url,'status',r.status_code,'final',r.url,'bytes',len(r.content))
              if r.ok:
                  r.encoding=r.apparent_encoding
                  soup=BeautifulSoup(r.text,'html.parser')
                  cards=soup.select('article.spot')
                  print(' cards',len(cards),'first',[(c.select_one('h3 a').get_text(' ',strip=True), c.select_one('p.ellipsis').get_text(' ',strip=True) if c.select_one('p.ellipsis') else '') for c in cards[:5]])
          d=requests.get('https://okazaki-kanko.jp/event/676',timeout=30,headers=headers)
          d.raise_for_status(); d.encoding=d.apparent_encoding
          ds=BeautifulSoup(d.text,'html.parser')
          for th in ds.find_all('th'):
              label=th.get_text(' ',strip=True)
              if label in {'開催期間','開催場所'}:
                  td=th.find_next_sibling('td')
                  print('DETAIL',label,td.get_text(' ',strip=True) if td else None)
