name: Probe Okazaki

on:
  push:
    branches: [probe-okazaki]
    paths:
      - '.github/workflows/okazaki-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4 requests
      - name: Inspect Okazaki source
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          headers={'User-Agent':'Mozilla/5.0 (compatible; EventHunterPersonal/1.0)','Accept-Language':'ja-JP,ja;q=0.9'}
          url='https://okazaki-kanko.jp/event/'
          r=requests.get(url,timeout=30,headers=headers)
          print('status',r.status_code,'bytes',len(r.content),'ctype',r.headers.get('content-type'))
          r.raise_for_status()
          r.encoding=r.apparent_encoding
          soup=BeautifulSoup(r.text,'html.parser')
          print('PAGERS',[(a.get_text(' ',strip=True),a.get('href')) for a in soup.find_all('a',href=True) if a.get_text(' ',strip=True) in {'2','3','次へ'}][:20])
          cards=soup.select('article.spot')
          print('CARDS',len(cards))
          print('TITLES',[(c.select_one('h3 a').get_text(' ',strip=True), c.select_one('p.ellipsis').get_text(' ',strip=True) if c.select_one('p.ellipsis') else '') for c in cards[:30]])
          detail='https://okazaki-kanko.jp/event/676'
          d=requests.get(detail,timeout=30,headers=headers)
          d.raise_for_status(); d.encoding=d.apparent_encoding
          ds=BeautifulSoup(d.text,'html.parser')
          print('DETAIL_LABELS')
          for tag in ds.find_all(['th','dt','td','dd','li','div','p']):
              txt=' '.join(tag.stripped_strings)
              if txt.startswith(('開催期間','開催場所','場所','会場')) and len(txt)<500:
                  print(tag.name,tag.get('class'),txt[:500],str(tag)[:1200])
