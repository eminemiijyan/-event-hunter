name: Update Event Hunter

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 6,18 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parser smoke test
        run: |
          PYTHONPATH=. python tests/test_parser.py
          PYTHONPATH=. python tests/test_aichi_now.py
          PYTHONPATH=. python tests/test_nagoya_info.py
          PYTHONPATH=. python tests/test_oasis21.py
          PYTHONPATH=. python tests/test_portmesse.py
          PYTHONPATH=. python tests/test_moricoro.py
          PYTHONPATH=. python tests/test_toyohashi.py
          PYTHONPATH=. python tests/test_okazaki.py
          PYTHONPATH=. python tests/test_toyota.py
          PYTHONPATH=. python tests/test_zepp_nagoya.py
          PYTHONPATH=. python tests/test_niterra.py
          PYTHONPATH=. python tests/test_aichi_arts.py
          PYTHONPATH=. python tests/test_gifu_guide.py
          PYTHONPATH=. python tests/test_gifu_culture.py
          PYTHONPATH=. python tests/test_gifu_ncc.py
          PYTHONPATH=. python tests/test_gifu_parks.py
          PYTHONPATH=. python tests/test_suzuka.py

      - name: Fetch core events
        run: PYTHONPATH=. python src/fetch_events_resilient.py

      - name: Add Aichi Now pickups
        run: python src/append_aichi_now.py

      - name: Add Nagoya Concierge city events
        run: PYTHONPATH=. python src/append_nagoya_info.py

      - name: Add Oasis21 major events
        run: PYTHONPATH=. python src/append_oasis21.py

      - name: Add Port Messe Nagoya exhibitions
        run: PYTHONPATH=. python src/append_portmesse.py

      - name: Add Moricoro Park major events
        run: PYTHONPATH=. python src/append_moricoro.py

      - name: Add Toyohashi major events
        run: PYTHONPATH=. python src/append_toyohashi.py

      - name: Add Okazaki major events
        run: PYTHONPATH=. python src/append_okazaki.py

      - name: Add Toyota major events
        run: PYTHONPATH=. python src/append_toyota.py

      - name: Add Zepp Nagoya concerts
        run: PYTHONPATH=. python src/append_zepp_nagoya.py

      - name: Add Niterra civic hall public events
        run: PYTHONPATH=. python src/append_niterra.py

      - name: Add Aichi Arts Theater official events
        run: PYTHONPATH=. python src/append_aichi_arts.py

      - name: Add Gifu tourism guide major events
        run: PYTHONPATH=. python src/append_gifu_guide.py

      - name: Add Gifu Culture Center public events
        run: PYTHONPATH=. python src/append_gifu_culture.py

      - name: Add Nagaragawa Convention Center public events
        run: PYTHONPATH=. python src/append_gifu_ncc.py

      - name: Add Gifu city major park events
        run: PYTHONPATH=. python src/append_gifu_parks.py

      - name: Add Suzuka Circuit major events
        run: PYTHONPATH=. python src/append_suzuka.py

      - name: Refine borderline events
        run: python src/refine_events.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
