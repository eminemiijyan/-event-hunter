name: Update Event Hunter

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 6,18 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parser smoke test
        run: |
          PYTHONPATH=. python tests/test_parser.py
          PYTHONPATH=. python tests/test_aichi_now.py
          PYTHONPATH=. python tests/test_nagoya_info.py
          PYTHONPATH=. python tests/test_oasis21.py
          PYTHONPATH=. python tests/test_portmesse.py
          PYTHONPATH=. python tests/test_moricoro.py
          PYTHONPATH=. python tests/test_fukiage.py
          PYTHONPATH=. python tests/test_toyohashi.py
          PYTHONPATH=. python tests/test_okazaki.py
          PYTHONPATH=. python tests/test_toyota.py
          PYTHONPATH=. python tests/test_zepp_nagoya.py
          PYTHONPATH=. python tests/test_niterra.py
          PYTHONPATH=. python tests/test_aichi_arts.py
          PYTHONPATH=. python tests/test_gifu_guide.py
          PYTHONPATH=. python tests/test_gifu_culture.py
          PYTHONPATH=. python tests/test_gifu_ncc.py
          PYTHONPATH=. python tests/test_gifu_parks.py
          PYTHONPATH=. python tests/test_suzuka.py
          PYTHONPATH=. python tests/test_nagashima.py
          PYTHONPATH=. python tests/test_miemu.py
          PYTHONPATH=. python tests/test_mie_culture.py
          PYTHONPATH=. python tests/test_mie_art.py
          PYTHONPATH=. python tests/test_ise_kanko.py
          PYTHONPATH=. python tests/test_toba_kanko.py
          PYTHONPATH=. python tests/test_toba_aquarium.py
          PYTHONPATH=. python tests/test_shima_spain.py
          PYTHONPATH=. python tests/test_shima_kanko.py
          PYTHONPATH=. python tests/test_watarai.py
          PYTHONPATH=. python tests/test_minamiise.py
          PYTHONPATH=. python tests/test_meiwa.py
          PYTHONPATH=. python tests/test_hamamatsu_kanko.py
          PYTHONPATH=. python tests/test_actcity.py
          PYTHONPATH=. python tests/test_ecopa.py
          PYTHONPATH=. python tests/test_iwata_kanko.py
          PYTHONPATH=. python tests/test_kakegawa_kanko.py
          PYTHONPATH=. python tests/test_fukuroi_kanko.py
          PYTHONPATH=. python tests/test_shizuoka_city.py
          PYTHONPATH=. python tests/test_yaizu_kanko.py
          PYTHONPATH=. python tests/test_publish_quality.py
          PYTHONPATH=. python tests/test_restore_previous_sources.py

      - name: Snapshot last published events
        run: PYTHONPATH=. python src/snapshot_previous_events.py

      - name: Fetch core events
        run: PYTHONPATH=. python src/fetch_events_resilient.py

      - name: Add Aichi Now pickups
        run: python src/append_aichi_now.py

      - name: Add Nagoya Concierge city events
        run: PYTHONPATH=. python src/append_nagoya_info.py

      - name: Add Oasis21 major events
        run: PYTHONPATH=. python src/append_oasis21.py

      - name: Add Port Messe Nagoya exhibitions
        run: PYTHONPATH=. python src/append_portmesse.py

      - name: Add Moricoro Park major events
        run: PYTHONPATH=. python src/append_moricoro.py

      - name: Add Fukiage Hall major events
        run: PYTHONPATH=. python src/append_fukiage.py

      - name: Add Toyohashi major events
        run: PYTHONPATH=. python src/append_toyohashi.py

      - name: Add Okazaki major events
        run: PYTHONPATH=. python src/append_okazaki.py

      - name: Add Toyota major events
        run: PYTHONPATH=. python src/append_toyota.py

      - name: Add Zepp Nagoya concerts
        run: PYTHONPATH=. python src/append_zepp_nagoya.py

      - name: Add Niterra civic hall public events
        run: PYTHONPATH=. python src/append_niterra.py

      - name: Add Aichi Arts Theater official events
        run: PYTHONPATH=. python src/append_aichi_arts.py

      - name: Add Gifu tourism guide major events
        run: PYTHONPATH=. python src/append_gifu_guide.py

      - name: Add Gifu Culture Center public events
        run: PYTHONPATH=. python src/append_gifu_culture.py

      - name: Add Nagaragawa Convention Center public events
        run: PYTHONPATH=. python src/append_gifu_ncc.py

      - name: Add Gifu city major park events
        run: PYTHONPATH=. python src/append_gifu_parks.py

      - name: Add Suzuka Circuit major events
        run: PYTHONPATH=. python src/append_suzuka.py

      - name: Add Nagashima Spa Land major events
        run: PYTHONPATH=. python src/append_nagashima.py

      - name: Add MieMu major exhibitions
        run: PYTHONPATH=. python src/append_miemu.py

      - name: Add Mie Culture Hall official events
        run: PYTHONPATH=. python src/append_mie_culture.py

      - name: Add Mie Prefectural Art Museum planning exhibitions
        run: PYTHONPATH=. python src/append_mie_art.py

      - name: Add Ise tourism major events
        run: PYTHONPATH=. python src/append_ise_kanko.py

      - name: Add Toba tourism major events
        run: PYTHONPATH=. python src/append_toba_kanko.py

      - name: Add Toba Aquarium seasonal events
        run: PYTHONPATH=. python src/append_toba_aquarium.py

      - name: Add Shima Spain Village major events
        run: PYTHONPATH=. python src/append_shima_spain.py

      - name: Add Shima tourism major events
        run: PYTHONPATH=. python src/append_shima_kanko.py

      - name: Add Watarai Town major events
        run: PYTHONPATH=. python src/append_watarai.py

      - name: Add Minamiise dated major events
        run: PYTHONPATH=. python src/append_minamiise.py

      - name: Add Meiwa tourism major events
        run: PYTHONPATH=. python src/append_meiwa.py

      - name: Add Hamamatsu tourism major events
        run: PYTHONPATH=. python src/append_hamamatsu_kanko.py

      - name: Add Act City Hamamatsu major events
        run: PYTHONPATH=. python src/append_actcity.py

      - name: Add Ecopa major events
        run: PYTHONPATH=. python src/append_ecopa.py

      - name: Add Iwata tourism major events
        run: PYTHONPATH=. python src/append_iwata_kanko.py

      - name: Add Kakegawa tourism major events
        run: PYTHONPATH=. python src/append_kakegawa_kanko.py

      - name: Add Fukuroi tourism major events
        run: PYTHONPATH=. python src/append_fukuroi_kanko.py

      - name: Add Shizuoka City major events
        run: PYTHONPATH=. python src/append_shizuoka_city.py

      - name: Add Yaizu tourism major events
        run: PYTHONPATH=. python src/append_yaizu_kanko.py

      - name: Refine borderline events
        run: python src/refine_events.py

      - name: Restore temporarily unavailable sources
        run: PYTHONPATH=. python src/restore_previous_sources.py

      - name: Publish quality gate
        run: PYTHONPATH=. python src/validate_publish.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
