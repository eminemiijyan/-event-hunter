name: Probe Port Messe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portmesse-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Inspect monthly event blocks
        shell: python
        run: |
          import urllib.request
          from bs4 import BeautifulSoup
          url='https://portmesse.com/events?month=11&yr=2026&time=month'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          soup=BeautifulSoup(html,'html.parser')
          for needle in ['第1回 中部食品産業創造展','メッセナゴヤ2026','建設技術フェア2026in中部']:
              node=soup.find(string=lambda s: s and needle in s)
              print('\nNEEDLE',needle,'FOUND',bool(node))
              if not node: continue
              p=node.parent
              for level in range(7):
                  if p is None: break
                  print('LEVEL',level,'TAG',p.name,'CLASS',p.get('class'),'ID',p.get('id'))
                  print('TEXT',' '.join(p.stripped_strings)[:1800])
                  print('LINKS',[(a.get_text(' ',strip=True),a.get('href')) for a in p.find_all('a',href=True)][:12])
                  p=p.parent
