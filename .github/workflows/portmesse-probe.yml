name: Probe Port Messe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portmesse-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Trace event data source
        shell: python
        run: |
          import re, urllib.request
          from urllib.parse import urljoin
          url='https://portmesse.com/events/upcoming'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          print('bytes',len(html))
          for needle in ['admin-ajax','ajaxurl','wp-json','my-calendar','my_calendar','mc_ajax','mc_id','calendar']:
              print('\nNEEDLE',needle, 'FOUND', needle.lower() in html.lower())
              for m in re.finditer(r'.{0,220}'+re.escape(needle)+r'.{0,420}', html, re.I):
                  print('CTX',m.group(0)[:900])
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          print('\nSCRIPTS')
          for src in scripts:
              full=urljoin(url,src)
              print(full)
              try:
                  js=urllib.request.urlopen(urllib.request.Request(full,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','replace')
              except Exception as e:
                  print('ERR',e); continue
              if any(n in js.lower() for n in ['admin-ajax','my_calendar','my-calendar','mc_ajax','wp-json']):
                  print('MATCH bytes',len(js))
                  for needle in ['admin-ajax','my_calendar','my-calendar','mc_ajax','wp-json']:
                      for m in re.finditer(r'.{0,180}'+re.escape(needle)+r'.{0,350}',js,re.I):
                          print('JSCTX',m.group(0)[:700])
