name: Probe Port Messe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portmesse-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test direct month URLs
        shell: python
        run: |
          import urllib.request
          urls=[
            'https://portmesse.com/events/upcoming?cid=mc_mini_widget-3&month=11&time=month&yr=2026',
            'https://portmesse.com/events?cid=mc_mini_widget-3&month=11&time=month&yr=2026',
            'https://portmesse.com/events?month=11&yr=2026&time=month',
          ]
          needles=['第1回 中部食品産業創造展','メッセナゴヤ2026','建設技術フェア2026in中部']
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
              print('\nURL',url,'bytes',len(html))
              for n in needles:
                  print(n, n in html)
              for marker in ['mc_mini_widget-3','mc-events','calendar-event','data-event']:
                  print(marker,html.lower().count(marker.lower()))
