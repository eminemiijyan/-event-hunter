name: Probe Toyota

on:
  push:
    branches: [probe-toyota]
    paths:
      - '.github/workflows/toyota-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4 requests
      - name: Inspect Tourism Toyota monthly event boxes
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          headers={'User-Agent':'Mozilla/5.0 (compatible; EventHunterPersonal/1.0)','Accept-Language':'ja-JP,ja;q=0.9'}
          url='https://www.tourismtoyota.jp/events/calendar/2026-11-01/'
          r=requests.get(url,timeout=30,headers=headers)
          print('PAGE',r.status_code,len(r.content)); r.raise_for_status(); r.encoding=r.apparent_encoding
          soup=BeautifulSoup(r.text,'html.parser')
          boxes=soup.select('.monthly_event_box')
          print('BOXES',len(boxes))
          for box in boxes:
              txt=' '.join(box.stripped_strings)
              if any(k in txt for k in ['とよた産業フェスタ','香嵐渓もみじまつり','KIRABOSHI FES','豊田しもやまラリー']):
                  print('BOX_TEXT',txt[:1200])
                  print('BOX_HTML',str(box)[:4500])
