name: Probe Zepp Nagoya

on:
  push:
    branches: [probe-zepp]
    paths:
      - '.github/workflows/zepp-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4 requests
      - name: Inspect Zepp Nagoya November event HTML
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          url='https://www.zepp.co.jp/hall/nagoya/schedule/?_y=2026&_m=11'
          r=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0 (compatible; EventHunterPersonal/1.0)','Accept-Language':'ja-JP,ja;q=0.9'})
          print('PAGE',r.status_code,len(r.content),r.url)
          r.raise_for_status(); r.encoding=r.apparent_encoding
          soup=BeautifulSoup(r.text,'html.parser')
          anchors=soup.select('a.sch-content[href*="/hall/nagoya/schedule/single/"]')
          print('COUNT',len(anchors))
          for a in anchors[:4]:
              print('TEXT', ' | '.join(a.stripped_strings)[:1500])
              print('HTML', str(a)[:6000])
