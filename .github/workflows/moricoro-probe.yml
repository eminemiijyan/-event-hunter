name: Probe Moricoro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moricoro-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4 requests
      - name: Inspect Moricoro event blocks
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          url='https://www.aichi-koen.com/moricoro/moricoro_event/'
          r=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
          r.raise_for_status()
          r.encoding=r.apparent_encoding
          soup=BeautifulSoup(r.text,'html.parser')
          for needle in ['長久手市商工会まつり','あいちサトラボ収穫祭','モリコロパーク秋まつり']:
              node=soup.find(string=lambda s: s and needle in s)
              print('\nNEEDLE',needle,'FOUND',bool(node))
              if not node: continue
              p=node.parent
              for level in range(8):
                  if p is None: break
                  print('LEVEL',level,'TAG',p.name,'CLASS',p.get('class'),'ID',p.get('id'))
                  print('TEXT',' '.join(p.stripped_strings)[:1800])
                  print('LINKS',[(a.get_text(' ',strip=True),a.get('href')) for a in p.find_all('a',href=True)][:12])
                  p=p.parent
