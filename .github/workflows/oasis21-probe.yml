name: Probe Oasis21

on:
  push:
    branches: [probe-oasis21]
    paths:
      - '.github/workflows/oasis21-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4 requests
      - name: Inspect Oasis21 event list HTML
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          url='https://www.sakaepark.co.jp/events/?ym=2026-11'
          r=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0 (compatible; EventHunterPersonal/1.0)','Accept-Language':'ja-JP,ja;q=0.9'})
          print('PAGE',r.status_code,len(r.content),r.url)
          r.raise_for_status(); r.encoding=r.apparent_encoding
          soup=BeautifulSoup(r.text,'html.parser')
          for a in soup.find_all('a',href=True):
              txt=' '.join(a.stripped_strings)
              if any(k in txt for k in ['栄まちじゅう音楽広場','パンマルシェ26','警察音楽隊','サックス侍']):
                  print('LINK',a.get('class'),txt[:700],a.get('href'))
                  parent=a
                  for _ in range(4):
                      parent=parent.parent
                      if not parent: break
                      print('PARENT',parent.name,parent.get('class'),' '.join(parent.stripped_strings)[:1200],str(parent)[:4500])
