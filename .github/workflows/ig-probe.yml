name: Probe Kyodo Tokai

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ig-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Kyodo Tokai event page
        shell: python
        run: |
          import re, urllib.request
          from bs4 import BeautifulSoup
          url='https://www.kyodotokai.co.jp/events/index/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          print('bytes', len(html))
          soup=BeautifulSoup(html,'html.parser')
          for needle in ['葉加瀬太郎','&TEAM','ENHYPEN','Zepp Nagoya','愛知県芸術劇場']:
              node=soup.find(string=lambda s: s and needle in s)
              print('\nNEEDLE', needle, 'FOUND', bool(node))
              if node:
                  p=node.parent
                  for level in range(6):
                      if p is None: break
                      print('LEVEL', level, 'TAG', p.name, 'CLASS', p.get('class'), 'ID', p.get('id'))
                      txt=' '.join(p.stripped_strings)
                      print(txt[:1200])
                      links=[(a.get_text(' ',strip=True),a.get('href')) for a in p.find_all('a',href=True)][:10]
                      print('LINKS', links)
                      p=p.parent
          print('\nALL EVENT-LIKE LINKS')
          for a in soup.find_all('a',href=True):
              href=a['href']
              text=a.get_text(' ',strip=True)
              if '/events/' in href and ('detail' in href or re.search(r'/events/\d+', href)):
                  print(text[:80], href)
