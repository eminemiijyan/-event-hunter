name: Probe IG Arena

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ig-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect monthly event API
        shell: python
        run: |
          import json, urllib.request
          url='https://www.ig-arena.jp/api/events/month?month=2026-11'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          data=json.loads(urllib.request.urlopen(req,timeout=30).read().decode('utf-8'))
          print('type', type(data).__name__)
          print('keys', list(data.keys()) if isinstance(data,dict) else None)
          items=data.get('data',[]) if isinstance(data,dict) else data
          print('count', len(items))
          for i,item in enumerate(items[:3]):
              print('ITEM', i)
              print(json.dumps(item, ensure_ascii=False, indent=2)[:5000])
