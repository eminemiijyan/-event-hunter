name: Probe IG Arena

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ig-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official pages
        shell: python
        run: |
          import re, urllib.request
          from html import unescape
          for url in ['https://www.ig-arena.jp/', 'https://www.ig-arena.jp/events/']:
              print('\nURL', url)
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              data = urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
              print('bytes', len(data))
              print('contains HOSHIMACHI', 'HOSHIMACHI' in data)
              print('contains 2026 11.7', '11.7' in data or '11.07' in data)
              scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', data, re.I)
              print('scripts')
              for s in scripts[-20:]: print(' ', s)
              print('event/api-like URLs')
              urls = sorted(set(re.findall(r'https?://[^"\'<> ]+', data)))
              for u in urls:
                  lu=u.lower()
                  if 'event' in lu or 'api' in lu:
                      print(' ', unescape(u)[:300])
