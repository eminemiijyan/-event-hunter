name: Probe Toyohashi

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toyohashi-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4 requests
      - name: Inspect Toyohashi source
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          url='https://www.honokuni.or.jp/toyohashi/event-info/?Mode=month&ym=2026-11'
          r=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0 (compatible; EventHunterPersonal/1.0)','Accept-Language':'ja-JP,ja;q=0.9'})
          print('status',r.status_code,'bytes',len(r.content),'ctype',r.headers.get('content-type'))
          r.raise_for_status()
          r.encoding=r.apparent_encoding
          soup=BeautifulSoup(r.text,'html.parser')
          print('title',soup.title.get_text(' ',strip=True) if soup.title else None)
          print('links',[(a.get_text(' ',strip=True)[:100],a.get('href')) for a in soup.find_all('a',href=True) if 'event-info' in a.get('href','')][:50])
          print('classes',sorted({c for tag in soup.find_all(True) for c in (tag.get('class') or []) if 'event' in c.lower() or 'list' in c.lower()})[:100])
          for sel in ['li','article','div','section']:
              hits=[]
              for tag in soup.select(sel):
                  txt=tag.get_text(' ',strip=True)
                  if '2026年11月' in txt and len(txt)<1000:
                      hits.append((tag.get('class'),txt[:500],str(tag)[:1200]))
                      if len(hits)>=8: break
              print('SAMPLE',sel,hits)
