name: Probe Nagoya Concierge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Inspect event page
        shell: python
        run: |
          import urllib.request, re
          from bs4 import BeautifulSoup
          url='https://www.nagoya-info.jp/event/?tdate=2026-10-31'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          print('bytes',len(html))
          soup=BeautifulSoup(html,'html.parser')
          for needle in ['台湾・台中夜市2026','覚王山秋祭2026','ホシガオカ COFFEE MARKET Oct.-Nov.']:
              node=soup.find(string=lambda s: s and needle in s)
              print('\nNEEDLE',needle,'FOUND',bool(node))
              if node:
                  p=node.parent
                  for level in range(8):
                      if p is None: break
                      txt=' '.join(p.stripped_strings)
                      print('LEVEL',level,'TAG',p.name,'CLASS',p.get('class'),'ID',p.get('id'))
                      print(txt[:1600])
                      links=[(a.get_text(' ',strip=True),a.get('href')) for a in p.find_all('a',href=True)][:12]
                      print('LINKS',links)
                      p=p.parent
          print('\nPAGINATION')
          for a in soup.find_all('a',href=True):
              h=a['href']; t=a.get_text(' ',strip=True)
              if 'page=' in h: print(t,h)
