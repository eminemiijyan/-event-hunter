name: Probe Nagoya Concierge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Inspect event card fields
        shell: python
        run: |
          import urllib.request
          from bs4 import BeautifulSoup
          url='https://www.nagoya-info.jp/event/?tdate=2026-10-31'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          soup=BeautifulSoup(html,'html.parser')
          node=soup.find(string=lambda s: s and '台湾・台中夜市2026' in s)
          card=node.find_parent('div',class_='event-slider-item')
          print('CARD', card.prettify()[:12000])
